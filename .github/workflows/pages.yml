name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish via peaceiris → gh-pages (legacy Pages source).
# actions/deploy-pages was creating deployments that never left an empty
# status and timed out after 10 minutes (runs 42094447274, 42098474451).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
          commit_message: "Deploy site ${{ github.sha }}"
